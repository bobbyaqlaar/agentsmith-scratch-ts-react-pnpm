name: Security Harness
on:
  workflow_call:
    inputs:
      strict:
        type: boolean
        default: false
jobs:
  security:
    runs-on: ubuntu-latest
    # Default optional so day-one tenant CI with strict:true does not fail
    # SEC-MOD-001; regulated tenants set MODERATION_HOOK=required (+ register).
    env:
      MODERATION_HOOK: ${{ vars.MODERATION_HOOK || 'optional' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Full requirements, not a minimal four. `--mode ci --strict` below
      # delegates several controls straight to existing suites (SEC-HITL-001
      # -> runtime/test/test_hitl_gate.py, SEC-BUDGET-001 ->
      # runtime/test/test_llm_gateway_budget.py, SEC-SELF-001 ->
      # runtime/test/test_self_correction.py — see
      # security/runners/delegating.py), which need real deps to import. With
      # the minimal set they fail on a missing dev dependency and report it as
      # a compliance violation — a hollow job is not a light one.
      # Guarded like ci-python-fastapi.yml's own install step — a tenant on
      # uv/poetry with no requirements.txt (AqlaarTeleologyStudio, found
      # checking CI after onboarding) must not hard-fail this step just
      # because the file doesn't exist.
      - run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      # httpx + tenacity are the runtime's own core dependencies (pyproject.toml
      # `dependencies`). Without them SEC-BUDGET-001 failed in every tenant
      # with no requirements.txt — AqlaarTeleologyStudio: three of
      # test_llm_gateway_budget.py's retry tests, `No module named 'httpx'`,
      # reported as a budget-control violation.
      - run: pip install pytest pytest-asyncio pyyaml pydantic jsonschema "httpx>=0.25,<1.0" "tenacity>=8.2,<10.0"
      # NOT `pytest scripts/test/test_security_*.py` (removed — every one of
      # those 8 files is framework-internal: several read
      # fixtures/security/control_registry.json off the FRAMEWORK's own repo
      # root, one runs hooks/post-checkout directly, and the rest are unit
      # tests of the runners' own logic against synthetic fixtures rather
      # than this tenant's actual repo — see AqlaarTeleologyStudio's
      # onboarding discussion. `--mode ci --strict` below is the real,
      # tenant-facing check: it reads THIS repo's own .agent-rfc/security/.
      - run: python3 scripts/run-security-checks.py --mode ci ${{ inputs.strict && '--strict' || '' }}
      - run: python3 scripts/run-security-checks.py --mode smoke --evidence-pack ./security-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: security-evidence/
