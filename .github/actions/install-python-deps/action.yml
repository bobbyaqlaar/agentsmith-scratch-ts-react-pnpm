name: "Install Python project dependencies"
description: >-
  Installs a Python project's own dependencies into the job's interpreter, from
  whichever manifest the project uses: requirements.txt, else uv.lock. The one
  implementation ci-python-fastapi.yml and eval-security.yml share — each used
  to carry its own copy, and only one of them learned about uv.

# Why the job's interpreter and not a venv: every later step in the calling
# workflows runs bare `pytest`, `ruff` and `python3 scripts/...`, so the
# project's packages must be where those resolve.
#
# Precedence: requirements.txt wins over uv.lock when both exist — a project
# that keeps a requirements.txt is declaring that file as what CI installs.
# hooks/post-checkout names the test tool by the same lockfile
# (scripts/test/test_ci_package_managers.py pins the two against each other).

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        elif [ -f uv.lock ]; then
          # uv PINNED, like ruff in ci-python-fastapi.yml: an unpinned tool
          # changes this gate with no commit. Bump deliberately.
          pip install "uv==0.12.13"
          # --locked, not --frozen: --frozen installs a lock that no longer
          # matches pyproject.toml without a word, silently dropping a newly
          # added dependency. --locked fails on it, as pnpm's
          # --frozen-lockfile does. --no-hashes: pip refuses an editable
          # `-e .` (a packaged project) in hash-checking mode.
          uv export --locked --no-hashes --format requirements-txt -o "$RUNNER_TEMP/uv-requirements.txt"
          pip install -r "$RUNNER_TEMP/uv-requirements.txt"
        elif [ -f pyproject.toml ] || [ -f Pipfile ]; then
          # Poetry, Pipenv or a plain PEP 621 project: none of its
          # dependencies are installed, and the job may still pass on the
          # tools alone. Say so on the run rather than fail a working setup.
          echo "::warning title=Project dependencies not installed::found pyproject.toml/Pipfile but no requirements.txt or uv.lock — only CI tooling is installed. Commit a lockfile this action supports, or add an install step."
        fi
