# AgentSmith as a provider in CI: the gate (contract/gate/v2/protocol.md), the
# rules and the evals — each port a tenant's providers.json declares as
# `agentsmith <port>`.
#
# A tenant's gates workflow — or its eval workflow — runs this at a pinned release —
#   uses: bobbyaqlaar/AgentSmith/.github/actions/setup-agentsmith@v2.1.0
# — and then asks `agentsmith gate ci` through its own launcher. Everything
# comes from the repository at the action's own ref, which the runner has
# already fetched: the gate, its requirements and the CLI. Nothing checks
# AgentSmith out at a branch, and the tenant holds none of it
# (.agent-rfc/designs/gate-contract-ci.md).
name: "Set up AgentSmith (gate provider)"
description: "Puts the `agentsmith` provider of this release on PATH — gate, rules and evals — with the environment they run in."
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: "AgentSmith, from this action's release"
      shell: bash
      run: |
        set -euo pipefail
        root="$(cd "${{ github.action_path }}/../../.." && pwd)"
        python -m pip install --quiet --disable-pip-version-check -r "$root/scripts/requirements-gate.txt"
        bin="${RUNNER_TEMP}/agentsmith-provider/bin"
        mkdir -p "$bin"
        # The CLI run from this release's own source, on PATH as `agentsmith`:
        # what the declaration's `agentsmith gate` command resolves to. `-P`:
        # `python -m` otherwise puts the working directory first on the path,
        # and in a vendored tenant that is the tenant's own, older `runtime/`.
        printf '#!/usr/bin/env bash\nPYTHONPATH="%s${PYTHONPATH:+:$PYTHONPATH}" exec "%s" -P -m runtime.cli "$@"\n' \
          "$root" "$(command -v python)" > "$bin/agentsmith"
        chmod +x "$bin/agentsmith"
        echo "$bin" >> "$GITHUB_PATH"
        echo "AGENTSMITH_DIR=$root" >> "$GITHUB_ENV"
        echo "AGENTSMITH_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
        "$bin/agentsmith" version
