name: Security (declared provider)

# This repository's security is checked by the security provider
# .agenticframework/providers.json declares (contract/security/v1), installed by
# the provider's own CI setup step at a pinned release and asked through the
# launcher: a row per control for this repository's own security pack
# (.agent-rfc/security/), the posture .agenticframework/tenant.yaml declares —
# never this job's environment — and its telemetry wire through the emitter the
# security port declares. Controls that test the provider's own code are the
# provider's CI's, not run here. Only a pass passes; there is no non-strict
# mode. The evidence pack is uploaded either way.

on:
  workflow_call:

jobs:
  security:
    runs-on: ${{ vars.AGENTSMITH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: "bobbyaqlaar/AgentSmith/.github/actions/setup-agentsmith@1d986d05ff89e595ce9ed7a4bc9d7c494a3b2361"
      - name: "Security: the declared provider (contract/security/v1)"
        run: bash .githooks/process-gate security check --evidence-dir security-evidence
      - name: "Compliance profile (a repository with none reports that and passes)"
        run: bash .githooks/process-gate compliance check --stage ci
      - name: "Upload security evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: security-evidence/
          if-no-files-found: ignore
